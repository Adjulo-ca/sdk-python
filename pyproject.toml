[project]
name = "adjulo"
version = "0.1.0"
description = "SDK Python officiel de l'API Adjulo — veille des marchés publics québécois et fédéraux (SEAO + CanadaBuys)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Propriétaire — Adjulo" }
authors = [{ name = "Adjulo", email = "info@adjulo.ca" }]
keywords = ["adjulo", "seao", "canadabuys", "marchés publics", "appels d'offres", "veille"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://adjulo.ca"
Documentation = "https://api.adjulo.io/docs"
API = "https://api.adjulo.io"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adjulo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests qui frappent une API réelle (nécessitent ADJULO_API_KEY + ADJULO_BASE_URL)",
]
